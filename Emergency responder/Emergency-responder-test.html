<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فريق الاستجابة | نموذج تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2e57;--navy2:#33527f;--org:#e8590c;--red:#c92a3a;--grn:#2f6b4f;--ink:#1b2e57;--mut:#667592;--bg:#f4f6fa;--card:#fff;--line:#e1e6ef;--tint:#eaf4ef;--sea:#d6e4f2;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6ebf5;--mut:#9aa8c4;--bg:#0d1526;--card:#16213a;--line:#263553;--tint:#17302a;--sea:#183049;--navy:#101c38}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:14px;max-width:440px;margin:auto}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:13px;font-weight:500}
.seg .on{background:var(--navy2);color:#fff}
.app{max-width:440px;margin:0 auto;padding-bottom:90px}.app.wide{max-width:980px;padding:14px}
.hero{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;padding:18px 16px 70px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.who{display:flex;align-items:center;gap:10px}.who small{opacity:.8;display:block;font-size:13px}.who b{font-size:17px}
.av{width:46px;height:46px;border-radius:50%;background:#d9b48a;display:grid;place-items:center;font-weight:700;color:var(--navy);border:2px solid #fff}
.bell{position:relative;background:none;border:0;font-size:24px;color:#fff}.bell i{position:absolute;top:-2px;left:-2px;background:var(--red);font-size:10px;font-style:normal;width:17px;height:17px;border-radius:50%;display:grid;place-items:center}
.pill{margin-top:18px;width:100%;border:0;border-radius:18px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--red);color:#fff;font-weight:700}
.pill.on{background:var(--grn)}
.pill span{display:flex;gap:8px;align-items:center;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px;margin-top:-52px}
.st{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;box-shadow:0 4px 14px rgba(27,46,87,.12)}
.st em{font-style:normal;font-size:22px;display:block}.st b{font-size:20px;display:block}
.sec{padding:0 14px}h2{font-size:17px;margin:20px 0 10px}h3{font-size:15px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc button{border:0;text-align:right;background:linear-gradient(135deg,var(--tint),var(--card) 70%);border-radius:16px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;font-weight:500;line-height:1.4;box-shadow:0 2px 10px rgba(27,46,87,.08)}
.svc em{font-style:normal;font-size:30px;align-self:flex-start}
.btn{border:0;border-radius:14px;padding:12px;font-weight:700;background:var(--grn);color:#fff;width:100%}
.btn.red{background:var(--red)}.btn.org{background:var(--org)}.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:440px;margin:auto}.nav button{flex:1;border:0;background:none;padding:8px 0;font-size:12px;color:var(--mut)}
.nav button.on{color:var(--grn);font-weight:700}.nav em{display:block;font-style:normal;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--org)}
.steps{list-style:none;margin:0;padding:0}.steps li{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--mut);font-size:14px}
.steps li:before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.d{color:var(--ink)}.steps li.d:before{background:var(--grn);border-color:var(--grn)}.steps li.c{color:var(--org);font-weight:700}.steps li.c:before{border-color:var(--org)}
.timer{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--org)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;background:var(--tint);color:var(--grn);font-weight:700}.tag.r{background:#fde8ea;color:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:6px}
.scr{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.scr div{flex:none;width:170px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
details{border-top:1px solid var(--line);padding:8px 0}summary{font-weight:700;cursor:pointer}ol{padding-inline-start:20px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(10,18,36,.7);z-index:20;display:grid;place-items:center;padding:16px}
.modal .card{max-width:400px;width:100%;border:3px solid var(--red);margin:0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.msg{padding:8px 12px;border-radius:14px;margin:6px 0;max-width:80%;background:var(--bg)}.msg.me{background:var(--grn);color:#fff;margin-inline-start:auto}
input{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;flex:1;background:var(--card);color:var(--ink)}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pulse{display:none}}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink)}.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;margin:0 0 6px 6px}.chip.on{background:var(--tint);border-color:var(--grn);color:var(--grn);font-weight:700}
.card input{width:100%;flex:none}a.btn{display:block;text-align:center;text-decoration:none}.row input{flex:1;width:auto}</style>
</head>
<body>
<div class="top"><div class="seg" id="seg"></div></div>
<div id="root"></div>
<script>
const TYPES=[["حريق مبنى","🔥",0],["تسرب غاز","⛽",1],["احتجاز مركبة في سيل","🌊",2],["انهيار","🏚️",3],["حادث مروري","🚗",4],["حالة طبية طارئة","🩺",5]];
const EQ=["طفاية حريق","حقيبة إسعاف","جهاز AED","كاشف غاز","حبال إنقاذ","إنارة ميدانية"];
const GUIDE=[["🔥","الحريق",["قيّم الحجم ومسار الانتشار وحدد مصادر الخطر (غاز، كهرباء)","أخلِ الأفراد القريبين وعزل المبنى بإغلاق الأبواب","لا تدخل المبنى؛ تعامل فقط مع الحريق الأولي بالطفاية","أغلق الغاز والكهرباء إن كان ذلك آمنًا","أعطِ الدفاع المدني موقع المحاصرين والمداخل عند وصوله"]],
["⛽","تسرب الغاز",["امنع أي مصدر اشتعال وأوقف الأجهزة الكهربائية","افتح التهوية وأغلق المحبس الرئيسي","أخلِ دائرة لا تقل عن 50 م وامنع الدخول","استخدم كاشف الغاز قبل الاقتراب"]],
["🌊","احتجاز مركبة في سيل",["لا تدخل المياه الجارية؛ استخدم حبلًا أو أداة إمساك من الحافة","ثبّت تواصلًا صوتيًا مع المحتجزين وأرشدهم للصعود لأعلى المركبة","حدد عدد الأشخاص واتجاه التيار وأبلغ غرفة العمليات"]],
["🏚️","الانهيار",["امنع الدخول وأبعد الجميع عن الواجهات المتصدعة","حدد مواقع المحاصرين بالنداء والإصغاء دون تحريك الأنقاض","أوقف الغاز والكهرباء للموقع","سجّل أعداد المفقودين وآخر موقع معروف لهم"]],
["🚗","الحادث المروري",["أمّن الموقع بإنارة تحذيرية وإغلاق المسار","قيّم الإصابات بالأولوية (تنفس، نزيف، وعي)","لا تحرك المصاب إلا عند خطر مباشر وثبّت الرقبة","أوقف النزيف بالضغط المباشر"]],
["🩺","الحالة الطبية الطارئة",["افحص الاستجابة والتنفس والنبض","ابدأ الإنعاش واستخدم AED عند الحاجة","أوقف النزيف وثبّت المصاب وراقب العلامات الحيوية","جهّز تقريرًا موجزًا للمسعف عند وصوله"]]];
const RANKS=[["مستجيب معتمد",0],["مستجيب متمرس",10],["خبير سلامة",25],["قائد ميداني",50]];
const ST=["تم استلام البلاغ","في الطريق للموقع","الوصول وبدء التثبيت","السيطرة على الوضع","اكتمال البلاغ"];
const INC=[250,110],RP=[[50,205],[50,110],[250,110]],AP=[[330,225],[250,225],[250,110]],HY=[[185,62],[120,160],[305,55],[215,200]],EV=[[75,75],[320,140]];
const DIST={"حي الروضة":[21.5640,39.1530],"حي الصفا":[21.5890,39.1960],"حي النزهة":[21.6100,39.1450],"حي الحمراء":[21.5290,39.1670]};
const MEM=[["سلطان القحطاني","القائد",21.5655,39.1602,1],["فهد الحربي","مستجيب · مكافحة حريق",21.5690,39.1580,1],["ماجد الزهراني","مستجيب · إدارة موقع",21.5740,39.1700,0],["عبدالله الشهري","مستجيب · إسعافات متقدمة",21.6000,39.1300,1]];
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),q=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return Math.round(12742000*Math.asin(Math.sqrt(q)))};
const dtxt=m=>m<1000?m+" م":(m/1000).toFixed(1)+" كم";
const gm=l=>`https://www.google.com/maps/search/?api=1&query=${l[0]},${l[1]}`;
const gd=l=>`https://www.google.com/maps/dir/?api=1&destination=${l[0]},${l[1]}&travelmode=driving`;
function locate(cb){if(!navigator.geolocation){toast("المتصفح لا يدعم تحديد الموقع");return}navigator.geolocation.getCurrentPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude];S.meReal=true;cb?cb():toast("تم تحديث موقعك من GPS")},()=>toast("تعذر تحديد الموقع، فعّل إذن الموقع للمتصفح"),{enableHighAccuracy:true,timeout:8000})}
function useMe(){const go=()=>{S.form.loc=[...S.me];toast("تم تحديد موقع البلاغ بإحداثيات جهازك")};S.meReal?go():locate(go)}
function near(loc){return MEM.filter(m=>m[4]&&hav([m[2],m[3]],loc)<=S.rad*1000)}
function nearCard(){const i=S.inc,base=i&&i.stage<4?i.loc:(S.form.loc||DIST[S.form.district]);const R=S.rad*1000;
const L=[...MEM.map(m=>[m[0],[m[2],m[3]],m[4]]),["خالد العتيبي (أنا)",S.me,S.ready?1:0]].map(m=>({n:m[0],p:m[1],r:m[2],d:hav(m[1],base)})).sort((a,b)=>a.d-b.d);
return`<div class="card"><h3>أقرب الأفراد للموقع</h3><div class="mut" style="margin-bottom:6px">نطاق التنبيه:</div><div>${[1,3,5].map(k=>`<button class="chip ${S.rad===k?"on":""}" onclick="S.rad=${k};render()">${k} كم</button>`).join("")}<a class="chip" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${gm(base)}">📍 موقع البلاغ</a></div>${L.map(m=>`<div class="row sp" style="padding:7px 0;border-top:1px solid var(--line)"><div><b>${m.n}</b><div class="mut">${dtxt(m.d)} · <a target="_blank" rel="noopener" href="${gm(m.p)}" style="color:var(--grn)">عرض موقعه</a></div></div><span class="tag ${m.r&&m.d<=R?"":"r"}">${!m.r?"غير جاهز":m.d<=R?"ضمن النطاق":"خارج النطاق"}</span></div>`).join("")}<div class="mut" style="margin-top:6px">يصل التنبيه تلقائيًا للجاهزين ضمن النطاق</div></div>`}
const F0=()=>({loc:null,type:0,sev:"عاجلة",district:"حي الروضة",street:"",landmark:"",desc:"",count:1,eq:[],note:"",notify:true});
const S={me:[21.5632,39.1522],meReal:false,rad:3,auth:true,nm:"",nc:"إسعافات أولية متقدمة",req:[["ريان الدوسري","مكافحة حريق أساسية"],["بدر العنزي","إسعافات أولية متقدمة"]],view:"resp",tab:"home",sheet:"",ready:false,h:145,n:27,s:15,inc:null,modal:false,toast:"",seq:318,log:[],form:F0(),chat:[["القائد","جهّزوا معداتكم، قد يصلكم بلاغ قريبًا",0]]};
const $=s=>document.querySelector(s);
const pt=(p,k)=>{const L=[];let t=0;for(let a=1;a<p.length;a++){const d=Math.hypot(p[a][0]-p[a-1][0],p[a][1]-p[a-1][1]);L.push(d);t+=d}let r=k*t;for(let a=0;a<L.length;a++){if(r<=L[a]){const f=r/L[a];return[p[a][0]+(p[a+1][0]-p[a][0])*f,p[a][1]+(p[a+1][1]-p[a][1])*f]}r-=L[a]}return p[p.length-1]};
const fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast="";render()},2400)}
function beep(){try{const c=new AudioContext();[0,.25,.5].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.15)})}catch(e){}}
function svgMap(h,mode){const i=S.inc,live=i&&i.stage>=0&&mode!=="idle",pend=i&&mode==="ops";let m=`<rect width="360" height="250" fill="var(--bg)"/><path d="M0 0H360V34Q270 52 180 32T0 40Z" fill="var(--sea)"/>`;
[[50,60,50,250],[150,45,150,250],[250,45,250,250],[340,50,340,250],[0,110,360,110],[0,160,360,160],[0,225,360,225]].forEach(l=>m+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="var(--line)" stroke-width="9"/>`);
if(live&&i.stage>=1)m+=`<polyline points="${RP.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--grn)" stroke-width="3" stroke-dasharray="6 5"/>`;
HY.forEach(a=>m+=`<circle cx="${a[0]}" cy="${a[1]}" r="8" fill="#2f7fd1"/><text x="${a[0]}" y="${a[1]+4}" text-anchor="middle" font-size="10">💧</text>`);
EV.forEach(a=>m+=`<rect x="${a[0]-9}" y="${a[1]-9}" width="18" height="18" rx="5" fill="var(--grn)"/><text x="${a[0]}" y="${a[1]+5}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">E</text>`);
if(i&&(live||pend)&&i.stage<4){m+=`<circle cx="${INC[0]}" cy="${INC[1]}" r="9" fill="var(--red)"/><circle class="pulse" cx="${INC[0]}" cy="${INC[1]}" r="9" fill="none" stroke="var(--red)" stroke-width="2"><animate attributeName="r" from="9" to="26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" from="1" to="0" dur="1.6s" repeatCount="indefinite"/></circle>`;
if(i.stage>=1){const p=pt(RP,i.rp);m+=`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="#fff" stroke="var(--grn)" stroke-width="4"/>`}}
else m+=`<circle cx="200" cy="130" r="8" fill="#2f6fde" stroke="#fff" stroke-width="3"/>`;
return`<svg viewBox="0 0 360 250" width="100%" height="${h}" preserveAspectRatio="xMidYMid slice" style="border-radius:14px;display:block">${m}</svg><div class="leg"><span>🔴 البلاغ</span><span>🟢 الفرد</span><span>💧 صنبور حريق</span><span>🟩 نقطة إخلاء</span></div>`}
function sendInc(){const f=S.form;if(S.inc&&S.inc.stage<4){toast("يوجد بلاغ نشط، أغلقه أولًا");return}
if(!f.street.trim()&&!f.landmark.trim()){toast("أدخل العنوان أو أقرب معلم");return}if(!f.desc.trim()){toast("أضف وصف الحالة");return}
const t=TYPES[f.type];const loc=f.loc||DIST[f.district];S.inc={loc,id:++S.seq,type:t[0],ic:t[1],g:t[2],sev:f.sev,addr:f.district+(f.street.trim()?" – "+f.street.trim():""),landmark:f.landmark.trim(),desc:f.desc.trim(),count:f.count,eq:[...f.eq],note:f.note.trim(),notify:f.notify,stage:-1,t:0,rp:0,tr:0,decl:false,mock:false,c:0,dist:Math.max(50,hav(S.me,loc)),by:""};
S.form=F0();if(S.ready){S.modal=true;beep();render()}else toast("تم إرسال البلاغ إلى "+near(loc).length+" أفراد جاهزين ضمن "+S.rad+" كم")}
function fillEx(){Object.assign(S.form,{type:0,sev:"حرجة",street:"شارع الأمير سلطان",landmark:"خلف مجمع الروضة التجاري",desc:"اشتعال نار في الدور الثاني لمبنى سكني ويُعتقد وجود شخصين داخل الشقة",count:2,eq:["طفاية حريق","حقيبة إسعاف"],note:"ادخلوا من البوابة الخلفية وانتظروا الدفاع المدني عند المدخل"});render()}
function accept(){S.modal=false;S.inc.stage=0;S.inc.by="خالد العتيبي";S.inc.mock=false;S.view="inc";render()}
function mockAccept(){const i=S.inc;i.stage=0;i.by="فهد الحربي";i.mock=true;render()}
function decline(){S.modal=false;S.inc.decl=true;toast("تم الاعتذار وإعادة البلاغ للقائد")}
function realert(){if(!S.ready){toast("لا يوجد فرد جاهز على هذا الجهاز");return}S.inc.decl=false;S.modal=true;beep();render()}
function done(){const i=S.inc;S.log.unshift([ "#"+i.id,i.type,i.addr,fmt(i.t)]);if(!i.mock){S.n++;S.s++;S.h++}}
function setStage(n){S.inc.stage=n;if(n===4){done();toast("تم إغلاق البلاغ وتسجيله في سجلك")}else render()}
setInterval(()=>{const i=S.inc;if(!i||i.stage<0||i.stage>=4)return;i.t++;i.tr=Math.min(.97,i.tr+.012);
if(i.stage===0)i.stage=1;else if(i.stage===1){i.rp=Math.min(1,i.rp+.05);if(i.rp>=1)i.stage=2}
else if(i.mock&&++i.c>=5){i.c=0;i.stage++;if(i.stage===4)done()}
